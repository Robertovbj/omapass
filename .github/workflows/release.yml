name: Release

# Disparado manualmente para publicar uma versão.
# Gera o AppImage, os pacotes do Windows e o DMG do macOS Intel em paralelo.
# Publica os arquivos e o SHA256SUMS quando os três builds passarem.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (em branco usa v<versão do main.cpp>)"
        required: false
        type: string
      prerelease:
        description: "Marcar como pré-lançamento"
        required: false
        default: false
        type: boolean

# Necessário para criar a release e subir os arquivos nela.
permissions:
  contents: write

jobs:
  linux:
    # Fixo, não `latest`: o AppImage herda a glibc de onde foi gerado, e uma
    # troca silenciosa de runner reduziria em que máquinas ele roda.
    runs-on: ubuntu-24.04

    outputs:
      versao: ${{ steps.pacote.outputs.versao }}
      tag: ${{ steps.pacote.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # `make appimage` compila dentro do container Ubuntu LTS descrito em
      # packaging/appimage.Dockerfile — o mesmo caminho de quem gera na
      # própria máquina, então o arquivo publicado aqui é o que se obtém lá.
      - name: Gera o AppImage
        run: make appimage

      - name: Descobre a versão e o arquivo
        id: pacote
        # A tag entra pelo ambiente, não interpolada no meio do script: um
        # `${{ }}` de texto livre vira parte do shell antes de ele rodar.
        env:
          TAG_PEDIDA: ${{ inputs.tag }}
        run: |
          versao="$(sed -n 's/.*applicationVersion = QStringLiteral("\([^"]*\)").*/\1/p' src/main.cpp)"
          arquivo="dist/omapass-$versao-x86_64.AppImage"
          if [ ! -f "$arquivo" ]; then
            echo "O AppImage esperado nao apareceu em $arquivo. O que ha em dist/:" >&2
            ls -la dist/ >&2
            exit 1
          fi
          tag="$TAG_PEDIDA"
          [ -n "$tag" ] || tag="v$versao"
          {
            echo "versao=$versao"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: omapass-linux-x64
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instala o Qt para Intel
        run: |
          python -m pip install aqtinstall==3.3.0
          aqt install-qt mac desktop 6.10.3 clang_64 -O "$RUNNER_TEMP/qt"
          qt="$RUNNER_TEMP/qt/6.10.3/macos"
          echo "QT_PREFIX=$qt" >> "$GITHUB_ENV"
          echo "QMAKE=$qt/bin/qmake" >> "$GITHUB_ENV"

      - name: Compila o Botan estático
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          if ! command -v pkg-config >/dev/null; then
            brew install pkgconf
          fi
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://botan.randombit.net/releases/Botan-3.14.1.tar.xz -o botan.tar.xz
          echo '5b85cba0f014d344eb8e9919aee0a3bdc31e16acb05816410025be9bee1e0930  botan.tar.xz' | shasum -a 256 -c
          tar -xf botan.tar.xz
          cd Botan-3.14.1
          python configure.py --cc=clang --cpu=x86_64 --prefix="$RUNNER_TEMP/botan" \
            --build-targets=static --no-install-python-module --with-pkg-config
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/botan/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BOTAN_LICENSE=$PWD/license.txt" >> "$GITHUB_ENV"

      - name: Gera o DMG
        run: ./bin/dmg

      - name: Confere que o app abre a partir do DMG
        run: |
          mv "$QT_PREFIX" "$RUNNER_TEMP/qt-para-compilar"
          volume="$RUNNER_TEMP/omapass-dmg"
          mkdir -p "$volume" "$RUNNER_TEMP/omapass-home"
          hdiutil attach -readonly -nobrowse -mountpoint "$volume" dist/*-macos-x64.dmg
          pid=""
          trap 'if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; hdiutil detach "$volume"' EXIT
          app="$volume/Omapass.app"
          binary="$app/Contents/MacOS/Omapass"
          test "$(readlink "$volume/Applications")" = /Applications
          codesign --verify --deep --strict "$app"
          HOME="$RUNNER_TEMP/omapass-home" "$binary" --doctor | grep -F "$app/Contents/Resources/wordlists/"
          log="$RUNNER_TEMP/omapass.log"
          HOME="$RUNNER_TEMP/omapass-home" QT_QUICK_BACKEND=software QML_IMPORT_TRACE=1 \
            "$binary" > "$log" 2>&1 &
          pid=$!
          for tentativa in {1..30}; do
            kill -0 "$pid" 2>/dev/null || break
            grep -q 'qrc:/Main.qml.*QtQuick.Controls.Basic/qmldir' "$log" && break
            sleep 1
          done
          sleep 5
          if ! kill -0 "$pid" || ! grep -q 'qrc:/Main.qml.*QtQuick.Controls.Basic/qmldir' "$log"; then
            tail -100 "$log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: omapass-macos-x64
          path: dist/*-macos-x64.dmg
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omapass-*-x64
          path: dist
          merge-multiple: true

      # Acompanha os arquivos: é a forma de quem baixa conferir que chegaram
      # inteiros.
      - name: Calcula o SHA256
        run: |
          cd dist
          ls -la
          sha256sum omapass-* > SHA256SUMS
          cat SHA256SUMS

      # `gh` já vem no runner, então nada de terceiros para publicar. Uma
      # release que já exista é reaproveitada, com os arquivos substituídos:
      # regerar os pacotes de uma versão é justamente o caso comum. A tag
      # nasce no commit que foi compilado, não no que a branch padrão for
      # depois.
      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux.outputs.tag }}
          VERSAO: ${{ needs.linux.outputs.versao }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "omapass $VERSAO" \
              --generate-notes \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
